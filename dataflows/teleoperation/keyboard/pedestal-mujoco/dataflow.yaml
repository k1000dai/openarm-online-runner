# Keyboard teleoperation on the MuJoCo pedestal scene from a web browser,
# with no VR headset and no real OpenArm: the keyboard node serves a page
# (http://127.0.0.1:8080/ by default) that captures keys over a WebRTC data
# channel and shows the MuJoCo head camera as WebRTC video. keyboard ->
# end-effector pose targets -> IK -> joint angles -> MuJoCo, and MuJoCo's
# head camera back to the browser. The arms move only while a motion key is
# held and the page has focus.

nodes:
  - id: keyboard # browser keys → EE pose targets, camera → browser
    build: pip install dora-openarm-keyboard
    path: dora-openarm-keyboard
    inputs:
      # The pedestal scene has no ceiling camera; the head camera gives
      # the browser view.
      image: mujoco/camera_head_left
    outputs:
      - pose_right
      - pose_left
      - status

  - id: ik # differential IK: EE poses → joint angles
    build: pip install dora-openarm-kinematics
    path: dora-openarm-ik
    inputs:
      # The solver runs on each target, not on the tick.
      target_right: keyboard/pose_right
      target_left: keyboard/pose_left
    outputs:
      - position_right
      - position_left
      - status

  - id: mujoco # MuJoCo pedestal scene, rendered offscreen for the browser
    # The released openarm-mujoco has no head cameras in the pedestal
    # scene yet, so install the patched fork the browser view needs.
    build: pip install dora-openarm-mujoco openarm-mujoco@git+https://github.com/k1000dai/openarm_mujoco@miraikan
    path: dora-openarm-mujoco
    args: "--scene pedestal --enable-collision --ctrl --render"
    inputs:
      position_right: ik/position_right
      position_left: ik/position_left
      pose_right: keyboard/pose_right
      pose_left: keyboard/pose_left
    outputs:
      - status
      - camera_head_left
