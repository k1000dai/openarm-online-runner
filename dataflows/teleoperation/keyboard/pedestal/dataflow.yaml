# Keyboard teleoperation of a real dual-arm OpenArm on the pedestal from a
# web browser, with no VR headset: the keyboard node serves a page
# (http://127.0.0.1:8080/ by default) that captures keys over a WebRTC data
# channel and shows one eye of the stereo head camera as WebRTC video.
# keyboard -> end-effector pose targets -> IK -> joint angles -> the
# follower arms, and the head camera back to the browser. The arms move only
# while a motion key is held and the page has focus.

nodes:
  - id: quittable-tick-camera
    build: pip install dora-openarm-quitter
    path: dora-openarm-quitter
    inputs:
      command: keyboard/command
      tick: dora/timer/millis/33  # ~30 fps
    outputs:
      - tick

  - id: keyboard # browser keys → EE pose targets, camera → browser
    build: pip install dora-openarm-keyboard
    path: dora-openarm-keyboard
    inputs:
      # The pedestal has no ceiling camera; one eye of the stereo head
      # camera gives the browser view.
      image: camera-head-stereo-splitter/image_0
    outputs:
      - pose_right
      - pose_left
      # Drives the quittable tick nodes' shutdown (quit) and, when a physical
      # lifter is part of the dataflow, dora-openarm-lifter (lifter-stop on
      # exit so the lifter never keeps moving).
      - command
      - status

  - id: ik # differential IK: EE poses → joint angles
    build: pip install dora-openarm-kinematics
    path: dora-openarm-ik
    inputs:
      # The solver runs on each target, not on the tick.
      target_right: keyboard/pose_right
      target_left: keyboard/pose_left
    outputs:
      - position_left
      - position_right
      - status

  - id: follower-right
    build: pip install dora-openarm
    path: dora-openarm
    args: "--side right --start-on-startup --config openarm_pedestal"
    inputs:
      move_position: ik/position_right
    outputs:
      - status

  - id: follower-left
    build: pip install dora-openarm
    path: dora-openarm
    args: "--side left --start-on-startup --config openarm_pedestal"
    inputs:
      move_position: ik/position_left
    outputs:
      - status

  - id: camera-head-stereo
    build: pip install opencv-video-capture
    path: opencv-video-capture
    env:
      # Please configure!
      # Stereo camera: left and right images placed side by side in one frame.
      CAPTURE_PATH: "/dev/camera_head_stereo"
      ENCODING: "bgr8"
      IMAGE_HEIGHT: 720
      IMAGE_WIDTH: 2560
    inputs:
      tick: quittable-tick-camera/tick
    outputs:
      - image

  - id: camera-head-stereo-splitter
    build: pip install dora-opencv-image-splitter
    path: dora-opencv-image-splitter
    env:
      SPLIT_MODE: "vertical"
      NUM_SPLITS: 2
      JPEG_QUALITY: 90
      IMAGE_HEIGHT: 720
      IMAGE_WIDTH: 2560
    inputs:
      image: camera-head-stereo/image
    outputs:
      - image_0
      - image_1
